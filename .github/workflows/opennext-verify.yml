name: OpenNext Verify

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

      - name: OpenNext build
        run: npm run pages:build

      - name: Wrangler dry run size check
        run: npx wrangler deploy .open-next/worker.js --assets .open-next/assets --dry-run
