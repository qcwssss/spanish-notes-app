name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext bundle
        run: npm run pages:build

      - name: Verify Wrangler CLI
        run: npx wrangler --version

      - name: Deploy preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env preview --config wrangler.jsonc

      - name: Resolve preview URL
        id: preview_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_WORKER_NAME: note-lingo-app-preview
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          async function main() {
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const workerName = process.env.PREVIEW_WORKER_NAME;
            const outputFile = process.env.GITHUB_OUTPUT;

            if (!accountId || !token || !workerName || !outputFile) {
              throw new Error('Missing required env for preview URL resolution');
            }

            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/subdomain`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                },
              },
            );

            if (!response.ok) {
              throw new Error(`Failed to fetch workers subdomain: ${response.status}`);
            }

            const data = await response.json();
            const subdomain = data?.result?.subdomain;
            if (!subdomain) {
              throw new Error('Workers subdomain missing in API response');
            }

            const url = `https://${workerName}.${subdomain}.workers.dev`;
            fs.appendFileSync(outputFile, `url=${url}\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Comment preview info on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "Preview deploy completed for \\`${{ github.sha }}\\` using Cloudflare Workers environment \\`preview\\`.\n\nPreview URL: ${{ steps.preview_url.outputs.url }}"

  preview-skipped:
    if: github.event.pull_request.head.repo.full_name != github.repository || secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == ''
    runs-on: ubuntu-latest
    steps:
      - name: Explain why preview deploy was skipped
        run: |
          echo "Skipping preview deploy."
          echo "Reasons:"
          echo "- PR from fork OR missing CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets."
